<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Tachyon</title>

    <style>
        body {
            margin: 0;
            background: #0b0b12;
            color: #eaeaea;
            font-family: Arial, sans-serif;
        }

        #chatBox {
            height: calc(100vh - 60px);
            overflow-y: auto;
            padding: 10px;
        }

        #chatForm {
            position: fixed;
            bottom: 0;
            width: 100%;
            display: flex;
            background: #12121a;
            padding: 10px;
            box-sizing: border-box;
        }

        #chatInput {
            flex: 1;
            padding: 10px;
            border: none;
            outline: none;
            background: #1a1a25;
            color: white;
        }

        #chatForm button {
            margin-left: 10px;
            background: #6a5acd;
            border: none;
            color: white;
            padding: 10px 16px;
            cursor: pointer;
        }

        .msg {
            margin: 6px 0;
            padding: 6px;
        }

        .msg .role {
            font-weight: bold;
            margin-right: 6px;
        }

        .msg.user {
            color: #9ad1ff;
        }

        .msg.system {
            color: #c7a6ff;
        }

        #clock {
            position: fixed;
            top: 10px;
            right: 10px;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div id="clock"></div>

    <div id="chatBox"></div>

    <form id="chatForm">
        <input id="chatInput" type="text" autocomplete="off" placeholder="Talk to Tachyon..." />
        <button type="submit">Send</button>
    </form>

    <!-- LOAD ORDER IS CRITICAL -->

    <script src="config.js"></script>
    <script src="prompts.js"></script>
    <script src="memory.js"></script>
    <script src="ollama.js"></script>
    <script src="commands.js"></script>
    <script src="ui.js"></script>
    <script src="script.js"></script>

</body>
</html>
